<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DHMR | Access System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #000; color: #fff; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.05); }
        input { background: rgba(255, 255, 255, 0.05) !important; border: 1px solid rgba(255, 255, 255, 0.1) !important; color: white !important; }
        input:focus { border-color: #007AFF !important; outline: none; }
    </style>
</head>
<body class="h-screen flex items-center justify-center px-6">

    <div class="w-full max-w-sm glass p-10 rounded-[2.5rem] shadow-2xl">
        <div class="text-center mb-10">
            <h1 class="text-2xl font-bold tracking-tighter mb-2">Welcome Back.</h1>
            <p class="text-xs text-gray-500 uppercase tracking-widest font-semibold">Enter your credentials</p>
        </div>

        <div id="error" class="hidden mb-6 p-4 bg-red-500/10 text-red-500 text-xs rounded-2xl border border-red-500/20"></div>

        <form id="login-form" class="space-y-4">
            <div>
                <input type="email" id="email" placeholder="Email Address" required class="w-full px-5 py-4 rounded-2xl text-sm transition">
            </div>
            <div>
                <input type="password" id="password" placeholder="Password" required class="w-full px-5 py-4 rounded-2xl text-sm transition">
            </div>
            <button type="submit" class="w-full bg-white text-black py-4 rounded-2xl font-bold hover:bg-gray-200 transition active:scale-95 mt-4">
                Continue
            </button>
        </form>

        <div class="mt-10 text-center">
            <a href="index.php" class="text-[10px] uppercase tracking-widest text-gray-500 hover:text-white transition">Back to Vision</a>
        </div>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error');

            try {
                const response = await fetch('/api/auth/login.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const result = await response.json();

                if (result.success) {
                    if (result.user.role === 'admin') {
                        window.location.href = '/admin/dashboard.php';
                    } else {
                        window.location.href = '/app/dashboard.php';
                    }
                } else {
                    errorDiv.innerText = result.error;
                    errorDiv.classList.remove('hidden');
                }
            } catch (err) {
                errorDiv.innerText = "Security sync failed. Check connection.";
                errorDiv.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
